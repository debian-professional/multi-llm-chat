<VirtualHost 172.29.255.1:80>
    ServerAdmin webmaster@localhost
    ServerName 172.29.255.1
    DocumentRoot /var/www/deepseek-chat

    # Automatische Umleitung zu HTTPS
    # Sicherheits-Fix Stufe 3 (26.07.2026): %{HTTP_HOST} uebernahm den vom
    # Client gesendeten Host-Header ungeprueft in die Redirect-URL. Ein
    # manipulierter Host-Header (z.B. "Host: evil.example") haette zu einer
    # Weiterleitung auf https://evil.example/... gefuehrt (Open-Redirect /
    # Header-Injection). Da es nur diesen einen vhost mit fester Adresse
    # gibt, wird der Servername jetzt fest verwendet statt aus dem
    # (client-kontrollierten) Host-Header uebernommen zu werden.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://172.29.255.1$1 [R=301,L]

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
