<VirtualHost 172.29.255.1:443>
    ServerAdmin webmaster@localhost
    ServerName 172.29.255.1
    DocumentRoot /var/www/deepseek-chat
    DirectoryIndex index.html

    # SSL-Konfiguration
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/deepseek.crt
    SSLCertificateKeyFile /etc/apache2/ssl/deepseek.key

    # Moderne SSL-Einstellungen
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    # Umgebungsvariable fuer API-Key (wird aus /etc/apache2/envvars geladen)

    SetEnv GOOGLE_API_KEY ${GOOGLE_API_KEY} 
    SetEnv DEEPSEEK_API_KEY ${DEEPSEEK_API_KEY}
    SetEnv HF_API_KEY ${HF_API_KEY}
    SetEnv GRQ_API_KEY ${GRQ_API_KEY}
    SetEnv OPENAI_API_KEY ${OPENAI_API_KEY}

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # DocumentRoot Verzeichnis
    <Directory /var/www/deepseek-chat>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # =========================================================================
    # CGI-Konfiguration fuer DeepSeek API-Proxy
    # =========================================================================
    ScriptAlias /cgi-bin/ /var/www/deepseek-chat/cgi-bin/
    <Directory /var/www/deepseek-chat/cgi-bin>
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require all granted
    </Directory>
</VirtualHost>

